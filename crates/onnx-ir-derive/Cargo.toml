[package]
authors = ["Dilshod Tadjibaev (@antimora)"]
name = "onnx-ir-derive"
description = "Derive macros for onnx-ir"
version = "0.20.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tracel-ai/burn/tree/main/crates/onnx-ir-derive"

[workspace]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.104"
quote = "1.0.42"
syn = { version = "2.0.111", features = ["full", "extra-traits"] }
